global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    bench: browsergym

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [name]
        regex: '^$'
        action: drop
      - source_labels: [name]
        regex: '(browsergym-(service|loadgen)|cadvisor|prometheus|grafana)'
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
