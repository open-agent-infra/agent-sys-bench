# Example configuration for core.service.search
scheduling_policy: round_robin
default_engine: tavily
instances:
  - name: tavily:default
    engine: tavily
    api_key: ${TAVILY_API_KEY}
    enabled: true
    group_name: default
    tags: [tavily]
    caching:
      enabled: true
      backend: file
      default_ttl: 3600 # Cache TTL in seconds
      location: "tmp/legoagent_cache/tavily" # Optional, specify if needed
      tags: [tavily]
  - name: arxiv:default
    engine: arxiv
    enabled: true
    group_name: default
    tags: [arxiv]
    caching:
