client_mode: True
service_impl: fastapi

service_list:
  - module_name: agsbench_claude.run_mcp_task
    name: run_mcp_task
    ip: ${CLAUDE_MCP_SERVICE_HOST:-claude-mcp-service}
    port: ${CLAUDE_MCP_SERVICE_PORT:-1707}

monitor: True
monitor_storage:
  type: csv
  store_dir: ./.cache/claude-mcp/client
