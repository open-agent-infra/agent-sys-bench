[build-system]
requires = [
    "setuptools>=61.0",
    "fastapi[standard]>=0.114.2",
    "aiohttp>=3.8.0",
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "protobuf>=5.29.4"
]
build-backend = "setuptools.build_meta"

[project]
name = "fast-service"
version = "0.0.1"
description = "Help transfer functions to network services fast."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]