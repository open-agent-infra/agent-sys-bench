service_impl: fastapi
ip: 127.0.0.1
port: 8001
service_list:
  - module_name: example_app
    name: multi_file_compute
    ip: 127.0.0.1
    port: 8001
  - module_name: example_app
    name: single_file_compute
    ip: 127.0.0.1
    port: 8001
  - module_name: example_app
    name: monitored_compute
    ip: 127.0.0.1
    port: 8001
  - module_name: example_app
    name: simple_compute
    ip: 127.0.0.1
    port: 8001

monitor: True
monitor_storage:
  type: csv
  store_dir: ./.cache/computing

store_intermediate: True
intermediate_storage:
  store_dir: ./.cache/computing/intermediate