[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-protocol"
version = "0.1.0"
description = "Scenario-agent interface protocol: decoupled HTTP dispatch for AgentSysBench benchmark loadgens."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]
